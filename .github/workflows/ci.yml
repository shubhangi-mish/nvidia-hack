name: CI
# Disabled by default while the hackathon prototype is under active construction.
# Run manually from GitHub Actions when a build is ready for validation.
on: workflow_dispatch
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: lastline
          POSTGRES_USER: lastline
          POSTGRES_PASSWORD: change_me
        ports: [5432:5432]
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install '.[dev]'
      - run: python -c "import psycopg; c=psycopg.connect('postgresql://lastline:change_me@localhost:5432/lastline'); c.execute(open('../../infra/migrations/001_initial.sql').read()); c.commit()"
      - run: pytest tests
        env:
          DATABASE_URL: postgresql://lastline:change_me@localhost:5432/lastline
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
