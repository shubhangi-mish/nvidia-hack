services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lastline
      POSTGRES_USER: lastline
      POSTGRES_PASSWORD: change_me
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastline -d lastline"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://lastline:change_me@db:5432/lastline
      SESSION_SECRET: development-only-change-before-deploy
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
