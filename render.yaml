services:
  - type: web
    name: lastline-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SOURCE_INGEST_TOKEN
        generateValue: true
      - key: OPERATIONS_TOKEN
        generateValue: true
